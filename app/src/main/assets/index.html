<!DOCTYPE html>
<html lang="hi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HisabKitab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --bg:#f3f6f5; --bg-2:#e9efed; --surface:#ffffff; --surface-2:#f6f9f8; --glass:rgba(255,255,255,.72);
  --text:#0d1f1c; --muted:#5b6e6a; --faint:#8fa19d; --border:#e1e9e6; --border-2:#cfdcd8;
  --brand:#0f766e; --brand-2:#14b8a6; --brand-ink:#ffffff; --brand-soft:#dff5f1;
  --accent:#f59e0b; --accent-soft:#fff3d6;
  --red:#e0413a; --red-soft:#fdecea; --green:#0e9f6e; --green-soft:#e2f7ef;
  --shadow-sm:0 1px 2px rgba(13,31,28,.06),0 1px 1px rgba(13,31,28,.04);
  --shadow:0 10px 30px -12px rgba(13,31,28,.18),0 2px 6px rgba(13,31,28,.05);
  --shadow-lg:0 30px 60px -20px rgba(13,31,28,.35);
  --r-sm:10px; --r:16px; --r-lg:22px;
  --grad:linear-gradient(135deg,#0f766e 0%,#14b8a6 55%,#5eead4 100%);
  --grad-warm:linear-gradient(135deg,#f59e0b,#f97316);
  --display:'Sora','Mukta',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Manrope','Mukta',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08110f; --bg-2:#0c1916; --surface:#0f1d1a; --surface-2:#132522; --glass:rgba(15,29,26,.72);
    --text:#e6f1ee; --muted:#93a8a3; --faint:#6a7f7a; --border:#1d302c; --border-2:#28403b;
    --brand:#2dd4bf; --brand-2:#14b8a6; --brand-ink:#04211d; --brand-soft:#0f2f2a;
    --accent:#fbbf24; --accent-soft:#2c2410;
    --red:#ff6b62; --red-soft:#2d1614; --green:#34d399; --green-soft:#0f2a20;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 30px 60px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08110f; --bg-2:#0c1916; --surface:#0f1d1a; --surface-2:#132522; --glass:rgba(15,29,26,.72);
  --text:#e6f1ee; --muted:#93a8a3; --faint:#6a7f7a; --border:#1d302c; --border-2:#28403b;
  --brand:#2dd4bf; --brand-2:#14b8a6; --brand-ink:#04211d; --brand-soft:#0f2f2a;
  --accent:#fbbf24; --accent-soft:#2c2410;
  --red:#ff6b62; --red-soft:#2d1614; --green:#34d399; --green-soft:#0f2a20;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 30px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}

/* ===================== BASE ===================== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:8px}
::selection{background:var(--brand-2);color:#fff}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===================== BUTTONS / INPUTS ===================== */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .2s var(--ease),box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px rgba(15,118,110,.7)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(15,118,110,.8)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-2);background:var(--surface)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 10px 22px -12px var(--red)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 10px 22px -12px var(--green)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);cursor:pointer;color:var(--text);transition:.2s var(--ease)}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.45);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--brand-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 18%,transparent)}
.input-wrap{position:relative}
.input-wrap .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);width:18px;height:18px}
.input-wrap .input{padding-left:40px}
.input-wrap .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--faint);cursor:pointer;padding:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* ===================== AUTH ===================== */
#auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;position:relative;overflow:hidden}
.hero{position:relative;background:#062b27;color:#e8fffa;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;z-index:-1;animation:float 14s ease-in-out infinite}
.b1{width:420px;height:420px;background:#14b8a6;top:-120px;left:-80px}
.b2{width:360px;height:360px;background:#f59e0b;bottom:-140px;right:-60px;animation-delay:-5s;opacity:.55}
.b3{width:260px;height:260px;background:#0ea5e9;top:40%;left:45%;animation-delay:-9s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
.grid-bg{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 30% 40%,#000 20%,transparent 75%)}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em}
.logo-mark{width:42px;height:42px;border-radius:13px;background:var(--grad-warm);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;box-shadow:0 10px 30px -8px rgba(245,158,11,.7);position:relative;overflow:hidden}
.logo-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.logo span b{color:var(--accent)}
.hero h1{font-size:clamp(34px,4.6vw,58px);line-height:1.04;font-weight:800;margin-top:40px;max-width:12ch}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#5eead4,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:#a7d8cf;font-size:17px;max-width:44ch;margin:18px 0 0}
.ledger-demo{margin-top:34px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:20px;padding:16px;max-width:420px;display:grid;gap:10px}
.ld-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);animation:slideIn .8s var(--ease) both}
.ld-row:nth-child(2){animation-delay:.15s}.ld-row:nth-child(3){animation-delay:.3s}
.ld-row .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#062b27}
.ld-row b{font-size:14px;display:block}.ld-row small{color:#89bfb5;font-size:12px}
.ld-row .amt{margin-left:auto;font-family:var(--display);font-weight:700}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.hero-foot{display:flex;gap:22px;flex-wrap:wrap;color:#89bfb5;font-size:13px;margin-top:30px}
.hero-foot div{display:flex;gap:8px;align-items:center}
.coin{position:absolute;font-family:var(--display);font-weight:800;color:rgba(253,230,138,.9);animation:rise 9s linear infinite;z-index:-1;opacity:0}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}

.auth-side{display:grid;place-items:center;padding:32px 20px;background:var(--bg)}
.auth-card{width:100%;max-width:420px;animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.auth-card h2{font-size:28px;font-weight:800}
.auth-card .sub{color:var(--muted);margin:6px 0 24px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);border-radius:14px;padding:4px;position:relative;margin-bottom:22px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:10px;font-weight:700;border-radius:10px;cursor:pointer;color:var(--muted);transition:color .3s}
.seg button.on{color:var(--text)}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);border-radius:10px;box-shadow:var(--shadow-sm);transition:transform .45s var(--ease)}
.seg.two .pill{transform:translateX(100%)}
.form{display:grid;gap:14px}
.hint{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);padding:10px 12px;border-radius:12px}
.hint.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--text);margin-top:14px;animation:pop .6s var(--ease)}
.credit{text-align:center;color:var(--faint);font-size:12.5px;margin-top:26px}
.credit b{color:var(--brand)}
@media (max-width:900px){
  #auth{grid-template-columns:1fr}
  .hero{padding:28px 20px 34px}
  .hero h1{margin-top:22px;font-size:32px}
  .ledger-demo,.hero-foot{display:none}
  .auth-side{padding-top:24px;margin-top:-18px;border-radius:24px 24px 0 0;position:relative;z-index:2}
}

/* ===================== APP SHELL ===================== */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:var(--surface)}
.side .logo{padding:4px 10px 22px;color:var(--text)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:700;border:0;background:none;text-align:left;width:100%;position:relative;transition:color .2s,background .2s}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.on{color:var(--brand);background:var(--brand-soft)}
.nav.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brand);animation:grow .4s var(--ease)}
@keyframes grow{from{transform:scaleY(0)}}
.side .spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border)}
.me .av{width:38px;height:38px}
.me b{display:block;font-size:14px;line-height:1.2}.me small{color:var(--muted);font-size:12px}
.side .dev{font-size:11.5px;color:var(--faint);text-align:center;padding-top:10px}
.side .dev b{color:var(--brand)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.top h1{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:12.5px}
.top .grow{flex:1;min-width:0}
.top .mlogo{display:none}
#view{padding:24px clamp(16px,3vw,32px) 120px;max-width:1240px;width:100%;margin:0 auto}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--grad-warm);z-index:100;width:0;opacity:0;transition:width .4s var(--ease),opacity .3s}
.progress.on{opacity:1;width:70%}
.progress.done{width:100%;opacity:0}

.bnav{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .top .mlogo{display:grid}
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px;padding:6px;box-shadow:var(--shadow-lg)}
  .bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 2px;font-size:11px;font-weight:700;color:var(--faint);border-radius:14px;cursor:pointer;transition:.25s var(--ease)}
  .bnav button.on{color:var(--brand);background:var(--brand-soft)}
  .bnav button.on svg{animation:bounce .5s var(--ease)}
  #view{padding-bottom:130px}
}
@keyframes bounce{40%{transform:translateY(-4px)}}

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm)}
.card h3{font-size:16px;font-weight:700}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.anim{animation:up .6s var(--ease) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.view-enter{animation:fadeView .45s var(--ease)}
@keyframes fadeView{from{opacity:.001;transform:translateY(8px)}}

.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.greet h2{font-size:clamp(22px,3vw,30px);font-weight:800}
.greet p{margin:4px 0 0;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.stat{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;background:var(--surface);border:1px solid var(--border);transition:transform .3s var(--ease),box-shadow .3s}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.stat .lbl{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:13px}
.stat .lbl .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.stat .val{font-family:var(--display);font-size:clamp(24px,2.6vw,32px);font-weight:800;margin-top:10px;letter-spacing:-.03em}
.stat .foot{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.get .dot{background:var(--red-soft);color:var(--red)} .stat.get .val{color:var(--red)}
.stat.give .dot{background:var(--green-soft);color:var(--green)} .stat.give .val{color:var(--green)}
.stat.net{background:var(--grad);color:#fff;border:0}
.stat.net .lbl,.stat.net .foot{color:rgba(255,255,255,.85)}
.stat.net .dot{background:rgba(255,255,255,.2);color:#fff}
.stat.net::after{content:"₹";position:absolute;right:-10px;bottom:-40px;font-family:var(--display);font-size:150px;font-weight:800;color:rgba(255,255,255,.12);line-height:1}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat.net{grid-column:1/-1;order:-1}}

.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:980px){.row2{grid-template-columns:1fr}}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10.5px;font-family:var(--body);font-weight:600}
.chart .gl{stroke:var(--border);stroke-dasharray:3 4}
.chart .bg{fill:var(--red)} .chart .bt{fill:var(--green)}
.chart rect.bar{transform-box:fill-box;transform-origin:bottom;animation:barUp .9s var(--ease) both}
@keyframes barUp{from{transform:scaleY(0)}}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.quick{gap:8px}.qa{font-size:12px;padding:14px 4px}}
/* ===== Money (personal income & expense) ===== */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.msw{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px}
.msw b{min-width:110px;text-align:center;font-family:var(--display);font-size:15px}
.msw button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.msw button:hover{background:var(--brand-soft);color:var(--brand)}
.msw button[disabled]{opacity:.35;pointer-events:none}
.stat .delta{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--surface-2)}
.stat.net .delta{background:rgba(255,255,255,.18);color:#fff}
.track{height:12px;border-radius:99px;background:var(--bg-2);overflow:hidden;position:relative}
.fill{height:100%;border-radius:inherit;width:var(--w);background:var(--grad);animation:fillIn 1.1s var(--ease) both}
.fill.warn{background:var(--grad-warm)} .fill.over{background:linear-gradient(90deg,#f97316,var(--red))}
@keyframes fillIn{from{width:0}}
.bud{display:grid;gap:10px}
.bud .brow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bud .big{font-family:var(--display);font-size:22px;font-weight:800}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
@media (max-width:520px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:170px;height:170px;animation:spinIn 1s var(--ease) both}
@keyframes spinIn{from{transform:rotate(-90deg) scale(.6);opacity:0}}
.donut text{fill:var(--text);font-family:var(--display)}
.donut .sm{fill:var(--muted);font-family:var(--body);font-size:10px;font-weight:700}
.clegend{display:grid;gap:8px;width:100%}
.cl{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.cl .e{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:hsl(var(--h) 80% 93%)}
:root[data-theme="dark"] .cl .e{background:hsl(var(--h) 40% 18%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cl .e{background:hsl(var(--h) 40% 18%)}}
.cl .bar{height:6px;border-radius:99px;background:var(--bg-2);margin-top:4px;overflow:hidden}
.cl .bar i{display:block;height:100%;width:var(--w);background:hsl(var(--h) 65% 50%);border-radius:inherit;animation:fillIn 1s var(--ease) both}

function chartSVG(days) {
  const W = 640, H = 220, pl = 44, pb = 26, pt = 10, max0 = Math.max(1, ...days.map(d => Math.max(d.gave, d.got)));
  const mag = Math.pow(10, Math.floor(Math.log10(max0))), max = Math.ceil(max0 / mag) * mag;
  const cw = (W - pl - 8) / days.length, bw = Math.max(4, cw * .3), y = v => pt + (H - pt - pb) * (1 - v / max);
  const short = v => v >= 1e7 ? (v / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1).replace(/\.0$/, '') + 'L' : v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(v);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line class="gl" x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`; }
  days.forEach((d, i) => {
    const x = pl + i * cw + cw / 2;
    const bar = (v, cls, dx, k) => v > 0 ? `<rect class="bar ${cls}" x="${x + dx}" y="${y(v)}" width="${bw}" height="${Math.max(1, y(0) - y(v))}" rx="3" style="animation-delay:${(i * 40) + k}ms"><title>${fdate(d.date)} · ${t(cls === 'bg' ? 'gave' : 'got')} ${inr(v)}</title></rect>` : '';
    g += bar(d.gave, 'bg', -bw - 1, 0) + bar(d.got, 'bt', 1, 60);
    if (i % 2 === 0 || days.length < 8) g += `<text x="${x}" y="${H - 6}" text-anchor="middle">${+d.date.slice(8)} ${MONTHS[S.lang][+d.date.slice(5, 7) - 1]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('d.chart'))}">${g}</svg>`;
}

function exportCSV() {
  const r = S.report; if (!r) return;
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [[t('st.date'), t('r.party'), t('f.type'), t('st.details'), t('l.youGave'), t('l.youGot')].map(q).join(',')]
    .concat(r.rows.map(x => [x.date, x.party, typeName(x.partyType), x.note, x.kind === 'GAVE' ? x.amount : '', x.kind === 'GOT' ? x.amount : ''].map(q).join(',')));
  lines.push(['', '', '', t('total'), r.gave, r.got].map(q).join(','));
  const name = `HisabKitab_${r.from}_${r.to}.csv`, text = '\ufeff' + lines.join('\n');
  if (saveText(name, text, 'text/csv')) { toast(t('r.csv')); return; }
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(t('r.csv'));
}

function donutSVG(list, kind) {

function trendSVG(months) {
  const W = 640, H = 200, pl = 44, pb = 26, pt = 10, max0 = Math.max(1, ...months.map(x => Math.max(x.income, x.expense)));
  const mag = Math.pow(10, Math.floor(Math.log10(max0))), max = Math.ceil(max0 / mag) * mag;
  const cw = (W - pl - 8) / months.length, bw = Math.min(26, cw * .28), y = v => pt + (H - pt - pb) * (1 - v / max);
  const short = v => v >= 1e7 ? (v / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1).replace(/\.0$/, '') + 'L' : v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(v);
  let g = '';

}

const last10 = ph => String(ph || '').replace(/\D/g, '').slice(-10);
function normPhone(ph) {
  let d = String(ph || '').trim(), plus = d.startsWith('+');
  d = d.replace(/\D/g, '');
  if (d.length === 12 && d.startsWith('91')) return d.slice(2);
  if (d.length === 11 && d.startsWith('0')) return d.slice(1);
  return (plus ? '+' : '') + d;
}
const contactReq = {};
window.__hkContacts = function (id, json, err) {
  const req = contactReq[id]; delete contactReq[id]; if (!req) return;
  if (err === 'denied') return toast(t('ct.denied'), 'err');
  if (err === 'cancel') return;
  let list = []; try { list = JSON.parse(json || '[]'); } catch (e) { list = []; }
  gotContacts(list.map(c => ({ name: String(c.name || '').trim(), phone: normPhone(c.phone || '') })), req.multiple, req.type);
};
function pickContacts(multiple, type) {
  if (window.__hkIsApp && HKNative.allContacts) {
    const id = 'k' + Date.now(); contactReq[id] = { multiple, type };
    if (multiple) HKNative.allContacts(id); else HKNative.pickContact(id);
    return;
  }
  const canNative = 'contacts' in navigator && navigator.contacts && typeof navigator.contacts.select === 'function' && window.top === window.self;
  if (canNative) {
    navigator.contacts.select(['name', 'tel'], { multiple: true })
      .then(list => gotContacts(list.map(c => ({ name: ((c.name || [])[0] || '').trim(), phone: normPhone((c.tel || [])[0] || '') })), multiple, type))
      .catch(() => pickVcf(multiple, type));
    return;
  }
  pickVcf(multiple, type);
}
function pickVcf(multiple, type) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.vcf,.vcard,text/vcard,text/x-vcard'; inp.multiple = true; inp.style.display = 'none';
  inp.addEventListener('change', async () => {
    const files = [...inp.files]; inp.remove(); if (!files.length) return;
    const texts = await Promise.all(files.map(f => f.text()));
    gotContacts(texts.flatMap(parseVcf), multiple, type);
  });
  document.body.appendChild(inp); inp.click();
}
function gotContacts(list, multiple, type) {
  list = list.filter(c => c.name || c.phone);
  if (!list.length) return toast(t('ct.none'), 'err');
  const form = $('#overlay #fName');
  if (list.length === 1 && form) {
    $('#fName').value = list[0].name || list[0].phone; $('#fPhone').value = list[0].phone || '';
    $('#fName').animate([{ background: 'var(--brand-soft)' }, { background: 'var(--surface)' }], { duration: 900 });
    return toast(t('ct.filled'));
  }
  const ty = type || ($('#overlay #fType .on') && $('#overlay #fType .on').dataset.v) || S.tab;
  contactsSheet(list, ty);
}
function parseVcf(text) {
  const qp = s => { const b = []; for (let i = 0; i < s.length; i++) { const h = s.substr(i + 1, 2); if (s[i] === '=' && /^[0-9A-F]{2}$/i.test(h)) { b.push(parseInt(h, 16)); i += 2; } else b.push(s.charCodeAt(i) & 255); } try { return new TextDecoder().decode(new Uint8Array(b)); } catch (e) { return s; } };
  const un = s => s.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();
  const out = [];
  text = text.replace(/\r\n?/g, '\n').replace(/=\n/g, '').replace(/\n[ \t]/g, '');
  text.split(/BEGIN:VCARD/i).slice(1).forEach(card => {
    let fn = '', n = '', tels = [];
    card.split('\n').forEach(line => {
      const i = line.indexOf(':'); if (i < 0) return;
      const head = line.slice(0, i), key = head.split(';')[0].toUpperCase().replace(/^ITEM\d+\./, '');
      let val = line.slice(i + 1); if (/QUOTED-PRINTABLE/i.test(head)) val = qp(val);
      if (key === 'FN') fn = un(val);
      else if (key === 'N') { const [fam, giv, mid, pre] = val.split(';').map(un); n = [pre, giv, mid, fam].filter(Boolean).join(' '); }
      else if (key === 'TEL') tels.push(val.replace(/^tel:/i, '').trim());
    });
    const phone = normPhone(tels[0] || ''), name = (fn || n).trim();
    if (name || phone) out.push({ name: name || phone, phone });
  });
  return out;
}
function contactsSheet(list, ty) {
  const have = new Set(((S.data && S.data.parties) || []).map(p => last10(p.phone)).filter(Boolean));
  const seen = new Set();
  list = list.filter(c => { const k = (c.name + '|' + last10(c.phone)).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => a.name.localeCompare(b.name));
  let kind = ty === 'supplier' ? 'supplier' : 'customer';
  const o = openSheet({
    title: t('ct.title'), submit: t('ct.addN', { n: 0 }),
    body: `<div class="kind" id="cKind"><button type="button" data-v="customer">${t('customer')}</button><button type="button" data-v="supplier">${t('supplier')}</button></div>
      <div class="input-wrap">${ic('search')}<input class="input" id="cSearch" placeholder="${esc(t('ct.search'))}"></div>
      <div class="cbar"><label><input type="checkbox" id="cAll">${t('ct.all')}</label><span class="muted" id="cCount"></span></div>
      <div class="clist">${list.map((c, i) => { const dup = c.phone && have.has(last10(c.phone));
        return `<label class="crow${dup ? ' dis' : ''}" data-q="${esc((c.name + ' ' + c.phone).toLowerCase())}"><input type="checkbox" data-i="${i}" ${dup ? 'disabled' : ''}>${avatar(c.name)}<div class="m"><b>${esc(c.name)}</b><small>${esc(c.phone || '—')}${dup ? ' · ' + t('ct.exists') : ''}</small></div></label>`; }).join('')}</div>`,
    onSubmit: async () => {
      const items = $$('.clist input:checked', o).map(x => list[+x.dataset.i]);
      if (!items.length) throw new Error(t('ct.selectOne'));
      if (items.length > 500) throw new Error(t('ct.max'));
      const r = await call('party.bulk', { type: kind, items });
      toast(t('ct.done', { a: r.added, s: r.skipped }));
      S.tab = kind; await loadData();
      if (r.added === 1 && r.id) go('ledger', { id: r.id }); else go('parties');
    }
  });
  const btn = $('[type=submit]', o);
  const upd = () => { const n = $$('.clist input:checked', o).length; btn.textContent = t('ct.addN', { n }); $('#cCount', o).textContent = t('ct.sel', { n }); };
  const setKind = v => { kind = v; $$('#cKind button', o).forEach(b => b.className = b.dataset.v === v ? 'on got' : ''); };
  setKind(kind); upd();
  $$('#cKind button', o).forEach(b => b.addEventListener('click', () => setKind(b.dataset.v)));
  $('.clist', o).addEventListener('change', upd);
  $('#cAll', o).addEventListener('change', e => { $$('.crow', o).forEach(r => { const c = $('input', r); if (!c.disabled && r.style.display !== 'none') c.checked = e.target.checked; }); upd(); });
  $('#cSearch', o).addEventListener('input', e => { const q = e.target.value.toLowerCase(); $$('.crow', o).forEach(r => r.style.display = r.dataset.q.includes(q) ? '' : 'none'); });
  if (list.length === 1) { const c = $('.clist input:not(:disabled)', o); if (c) { c.checked = true; upd(); } }
  setTimeout(() => { const f = document.activeElement; f && f.id === 'cSearch' && f.blur(); }, 120);
}
